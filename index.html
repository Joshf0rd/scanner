<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the full iPhone screen; safe-area padding is handled in CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scanner</title>
  <meta name="description" content="Offline document scanner – scan pages and save them as a PDF">
  <meta name="theme-color" content="#1f4e79">

  <!-- PWA / iPhone Home Screen settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Every screen is rendered into #app by the JavaScript router (js/app.js) -->
  <div id="app" aria-live="polite"></div>

  <!-- Full-screen camera / crop editors, modal dialogs and toast messages are inserted here -->
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <noscript>This app needs JavaScript enabled.</noscript>

  <!-- Third-party library (stored locally so it works offline) -->
  <script src="js/lib/jspdf.umd.min.js"></script>

  <!-- App code. Order matters: utilities and database first, app.js (the router) last. -->
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/imaging.js"></script>
  <script src="js/crop.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
